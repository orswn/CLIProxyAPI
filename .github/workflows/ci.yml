name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: |
          go test -v ./internal/config ./internal/util ./internal/runtime/executor ./sdk/api/handlers -run "Test(BedrockMantle|SignAwsRequest|Combo.*|.*Combos).*"

      - name: Build server binary
        run: |
          CGO_ENABLED=0 go build -v -o /dev/null ./cmd/server
